{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar gasto · Mi Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'prendas/style.css' %}">
</head>
<body>

<nav class="navbar px-4 py-3">
    <a href="{% url 'lista_prendas' %}" class="navbar-brand fw-semibold fs-5"><span class="brand-mark">M</span> Mi Tienda</a>
    <a href="{% url 'lista_gastos' %}" class="btn btn-outline-secondary">← Volver</a>
</nav>

<main class="container py-5 form-surface"><div class="card"><div class="card-body text-center">
        <div style="font-size: 48px;">🗑️</div>
        <h1 class="page-heading h4 mt-3">¿Eliminar este gasto?</h1>
        <p class="form-intro">Vas a eliminar <strong>{{ gasto.concepto }}</strong> ({{ gasto.importe }}€). Esta acción no se puede deshacer.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center mt-3">
                <a href="{% url 'lista_gastos' %}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            </div>
        </form>
    </div></div></main>

</body>
</html>
